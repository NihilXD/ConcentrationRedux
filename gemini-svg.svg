<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c162b" />
      <stop offset="70%" stop-color="#0a0712" />
      <stop offset="100%" stop-color="#030206" />
    </radialGradient>

    <!-- Innate Buff Gold Glow -->
    <linearGradient id="innateGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="45%" stop-color="#e5b842" />
      <stop offset="100%" stop-color="#8a6114" />
    </linearGradient>

    <!-- Active Channel Arcane Cyan/Violet Glow -->
    <linearGradient id="activeAura" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#72f2eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Outer Frame Metal -->
    <linearGradient id="frameRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e8354" />
      <stop offset="50%" stop-color="#3a2f1b" />
      <stop offset="100%" stop-color="#786139" />
    </linearGradient>

    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base & Border -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGlow)" stroke="url(#frameRim)" stroke-width="12" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#e5b842" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6,4" />

  <!-- Outer Runic Ring -->
  <g opacity="0.6">
    <circle cx="256" cy="256" r="215" fill="none" stroke="#72f2eb" stroke-width="1.5" stroke-opacity="0.3" />
    <!-- Cardinal Runes / Markers -->
    <polygon points="256,22 250,38 262,38" fill="#e5b842" />
    <polygon points="256,490 250,474 262,474" fill="#e5b842" />
    <polygon points="22,256 38,250 38,262" fill="#72f2eb" />
    <polygon points="490,256 474,250 474,262" fill="#72f2eb" />
  </g>

  <!-- Primary Outer Glyphs (Focus Orbitals) -->
  <g filter="url(#bloom)">
    <!-- Active Channel Swirl (Emanation / Hazard) -->
    <path d="M 256,70 C 370,70 440,160 440,256 C 440,360 350,440 256,440 C 290,390 320,320 320,256 C 320,180 285,115 256,70 Z" 
          fill="url(#activeAura)" opacity="0.85" />
    
    <!-- Innate Ward Arc (Steadfast Protective Shield) -->
    <path d="M 256,70 C 142,70 72,160 72,256 C 72,360 162,440 256,440 C 222,390 192,320 192,256 C 192,180 227,115 256,70 Z" 
          fill="url(#innateGold)" opacity="0.85" />
  </g>

  <!-- Interlocking Cognitive Rings -->
  <g fill="none" stroke-width="8" filter="url(#bloom)">
    <!-- Top-Left Ring: Anchored Mind -->
    <circle cx="220" cy="230" r="95" stroke="url(#innateGold)" stroke-opacity="0.9" />
    <!-- Bottom-Right Ring: Active Channel -->
    <circle cx="292" cy="282" r="95" stroke="url(#activeAura)" stroke-opacity="0.9" />
  </g>

  <!-- Central Focus Node: The Unified Will -->
  <g filter="url(#bloom)">
    <!-- Radiant Starburst / Eye Core -->
    <polygon points="256,180 268,240 330,256 268,272 256,332 244,272 182,256 244,240" fill="#ffffff" />
    <circle cx="256" cy="256" r="14" fill="#fff4cc" />
    <circle cx="256" cy="256" r="6" fill="#0a0712" />
  </g>
</svg>
